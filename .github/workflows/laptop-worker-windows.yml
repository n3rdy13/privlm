# Builds PrivateLM-Laptop.exe: a Windows app that runs a model on the laptop
# with phones as workers (Master tab), makes images with Stable Diffusion
# models (Images tab), or shares the laptop's GPU (Vulkan) or CPU with a
# master phone (Worker tab). Download it from the run's Artifacts.
name: Laptop app (Windows)

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'tools/laptop_worker/**'
      - '.github/workflows/laptop-worker-windows.yml'
      - 'local_plugins/llama_flutter_android/android/src/main/cpp/llama.cpp/ggml/**'
      - 'local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp'

concurrency:
  group: laptop-worker-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      SD_DIR: local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp
      VULKAN_VERSION: 1.4.313.2
      # Static C++ runtime and no OpenMP DLL: runs without installing the
      # Visual C++ redistributable. AVX2 covers laptops from 2013 on.
      CPU_FLAGS: >-
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
        -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
        -DGGML_OPENMP=OFF
    steps:
      - uses: actions/checkout@v4

      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          curl.exe -sSL -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & $installer --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      - name: Build the CPU worker
        shell: pwsh
        run: |
          cmake -S tools/laptop_worker -B build/cpu $($env:CPU_FLAGS -split ' ')
          cmake --build build/cpu --config Release -j 4

      - name: Build the GPU (Vulkan) worker
        shell: pwsh
        run: |
          cmake -S tools/laptop_worker -B build/vulkan $($env:CPU_FLAGS -split ' ') -DGGML_VULKAN=ON
          cmake --build build/vulkan --config Release -j 4

      # The Master tab's llama-server comes from the llama.cpp release the
      # app's tree is based on (LLAMA_RELEASE in privatelm_worker.py).
      - name: Get llama.cpp for llama-server
        shell: pwsh
        run: |
          $release = (Select-String -Path tools/laptop_worker/privatelm_worker.py -Pattern '^LLAMA_RELEASE = "(.+)"').Matches[0].Groups[1].Value
          Add-Content $env:GITHUB_ENV "LLAMA_RELEASE=$release"
          git clone --quiet --depth 1 --branch $release https://github.com/ggml-org/llama.cpp "$env:RUNNER_TEMP/llama.cpp"

      - name: Check llama-server speaks the phones' protocol
        shell: bash
        run: |
          app=local_plugins/llama_flutter_android/android/src/main/cpp/llama.cpp/ggml/include
          up="$RUNNER_TEMP/llama.cpp/ggml/include"
          diff "$app/ggml-rpc.h" "$up/ggml-rpc.h"
          diff <(grep -o 'GGML_OP_[A-Z0-9_]*' "$app/ggml.h") <(grep -o 'GGML_OP_[A-Z0-9_]*' "$up/ggml.h")
          echo "RPC protocol and ops match the app's llama.cpp"

      - name: Build llama-server
        shell: pwsh
        run: |
          $build = "$($env:LLAMA_RELEASE.TrimStart('b'))"
          cmake -S "$env:RUNNER_TEMP/llama.cpp" -B build/server $($env:CPU_FLAGS -split ' ') `
            -DGGML_RPC=ON -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF `
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF "-DLLAMA_BUILD_NUMBER=$build"
          cmake --build build/server --config Release --target llama-server -j 4
          build/server/bin/Release/llama-server.exe --version

      # The Images tab's sd-server comes from the app's own
      # stable-diffusion.cpp (the image generation plugin's submodule).
      - name: Get stable-diffusion.cpp
        shell: bash
        run: |
          git submodule update --init --depth 50 "$SD_DIR"
          git -C "$SD_DIR" submodule update --init --depth 50 ggml

      - name: Build sd-server (CPU and Vulkan)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true  # stop at the first failing command
          # PNG only: WebP/WebM output isn't used and needs more submodules.
          $sd = "-DSD_SERVER_BUILD_FRONTEND=OFF", "-DBUILD_SHARED_LIBS=OFF", "-DSD_WEBP=OFF", "-DSD_WEBM=OFF"
          cmake -S $env:SD_DIR -B build/sd-cpu $($env:CPU_FLAGS -split ' ') $sd
          cmake --build build/sd-cpu --config Release --target sd-server -j 4
          cmake -S $env:SD_DIR -B build/sd-vulkan $($env:CPU_FLAGS -split ' ') $sd -DSD_VULKAN=ON
          cmake --build build/sd-vulkan --config Release --target sd-server -j 4
          build/sd-cpu/bin/Release/sd-server.exe --version

      - name: Check the workers run
        shell: pwsh
        run: |
          build/cpu/Release/privatelm-worker.exe --info
          # The runner has no GPU: the Vulkan build must still fall back cleanly.
          build/vulkan/Release/privatelm-worker.exe --info --cpu

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package PrivateLM-Laptop.exe
        shell: pwsh
        working-directory: tools/laptop_worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller zeroconf qrcode psutil
          python -m PyInstaller --noconfirm --onefile --windowed --name PrivateLM-Laptop `
            --collect-submodules zeroconf `
            --add-binary "../../build/server/bin/Release/llama-server.exe;bin/server" `
            --add-binary "../../build/sd-cpu/bin/Release/sd-server.exe;bin/sd-cpu" `
            --add-binary "../../build/sd-vulkan/bin/Release/sd-server.exe;bin/sd-vulkan" `
            --add-binary "../../build/cpu/Release/privatelm-worker.exe;bin/cpu" `
            --add-binary "../../build/vulkan/Release/privatelm-worker.exe;bin/vulkan" `
            worker_gui.py
          Get-Item dist/PrivateLM-Laptop.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-Laptop-windows
          path: tools/laptop_worker/dist/PrivateLM-Laptop.exe
          if-no-files-found: error
